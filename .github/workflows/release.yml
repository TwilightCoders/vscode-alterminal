name: Package & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. dev-20260310)"
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build WebGPU renderer addon
        run: |
          cd lib/xterm-addon-webgpu
          npm ci
          npm run build

      - name: Install all platform binaries
        run: |
          PKGS=(
            "@lydell/node-pty-darwin-arm64"
            "@lydell/node-pty-darwin-x64"
            "@lydell/node-pty-linux-arm64"
            "@lydell/node-pty-linux-x64"
            "@lydell/node-pty-win32-x64"
          )
          for pkg in "${PKGS[@]}"; do
            if [ ! -d "node_modules/$pkg" ]; then
              # Extract exact version from package-lock.json to avoid fetching latest
              VERSION=$(node -p "require('./package-lock.json').packages['node_modules/$pkg']?.version || ''")
              if [ -z "$VERSION" ]; then
                echo "⚠️ Could not find $pkg version in lockfile, skipping"
                continue
              fi
              tarball=$(npm pack "$pkg@$VERSION" --pack-destination /tmp 2>/dev/null)
              mkdir -p "node_modules/$pkg"
              tar xzf "/tmp/$tarball" -C "node_modules/$pkg" --strip-components=1
            fi
          done

      - name: Determine release info
        id: release_info
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            NAME="Alterminal ${TAG}"
            PRERELEASE=false
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
            VERSION="${CURRENT_VERSION}"
            NAME="Alterminal ${TAG} (dev)"
            PRERELEASE=true
          else
            TAG="dev-$(date +%Y%m%d-%H%M%S)"
            VERSION="${CURRENT_VERSION}"
            NAME="Alterminal ${TAG} (dev)"
            PRERELEASE=true
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version "${{ steps.release_info.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: |
          # vsce's npm list rejects cross-platform optional deps, so we build
          # with --no-dependencies and inject node_modules into the vsix.
          npx @vscode/vsce package --no-git-tag-version --skip-license --no-dependencies -o alterminal-bare.vsix

          # Unpack, inject deps, repack
          WORK=$(mktemp -d)
          cd "$WORK"
          unzip -q "$GITHUB_WORKSPACE/alterminal-bare.vsix"

          # Copy runtime dependencies into the vsix
          DEPS=(
            "@lydell/node-pty"
            "@lydell/node-pty-darwin-arm64"
            "@lydell/node-pty-darwin-x64"
            "@lydell/node-pty-linux-arm64"
            "@lydell/node-pty-linux-x64"
            "@lydell/node-pty-win32-x64"
            "@vscode/codicons"
            "@xterm/addon-fit"
            "@xterm/addon-serialize"
            "@xterm/addon-unicode11"
            "@xterm/addon-web-links"
            "@xterm/addon-webgl"
            "@xterm/xterm"
            "xterm-link-provider"
          )
          for dep in "${DEPS[@]}"; do
            src="$GITHUB_WORKSPACE/node_modules/$dep"
            if [ -d "$src" ]; then
              mkdir -p "extension/node_modules/$dep"
              cp -r "$src"/. "extension/node_modules/$dep/"
            else
              echo "⚠️ Missing dependency: $dep"
            fi
          done

          # Repackage vsix
          rm "$GITHUB_WORKSPACE/alterminal-bare.vsix"
          zip -qr "$GITHUB_WORKSPACE/alterminal.vsix" .
          cd "$GITHUB_WORKSPACE"
          rm -rf "$WORK"

          # Verify size is reasonable (should be ~10MB with deps, not ~3MB without)
          SIZE=$(stat --printf='%s' alterminal.vsix)
          echo "VSIX size: $((SIZE / 1024 / 1024))MB ($SIZE bytes)"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "❌ VSIX too small — dependencies likely missing"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          generate_release_notes: true
          files: alterminal.vsix
