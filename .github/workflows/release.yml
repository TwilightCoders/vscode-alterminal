name: Package & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. dev-20260310)"
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build WebGPU renderer addon
        run: |
          cd lib/xterm-addon-webgpu
          npm ci
          npm run build

      - name: Install all platform binaries
        run: |
          PKGS=(
            "@lydell/node-pty-darwin-arm64"
            "@lydell/node-pty-darwin-x64"
            "@lydell/node-pty-linux-arm64"
            "@lydell/node-pty-linux-x64"
            "@lydell/node-pty-win32-x64"
          )
          for pkg in "${PKGS[@]}"; do
            if [ ! -d "node_modules/$pkg" ]; then
              # Extract exact version from package-lock.json to avoid fetching latest
              VERSION=$(node -p "require('./package-lock.json').packages['node_modules/$pkg']?.version || ''")
              if [ -z "$VERSION" ]; then
                echo "⚠️ Could not find $pkg version in lockfile, skipping"
                continue
              fi
              tarball=$(npm pack "$pkg@$VERSION" --pack-destination /tmp 2>/dev/null)
              mkdir -p "node_modules/$pkg"
              tar xzf "/tmp/$tarball" -C "node_modules/$pkg" --strip-components=1
            fi
          done

      - name: Determine release info
        id: release_info
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            NAME="Alterminal ${TAG}"
            PRERELEASE=false
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
            VERSION="${CURRENT_VERSION}"
            NAME="Alterminal ${TAG} (dev)"
            PRERELEASE=true
          else
            TAG="dev-$(date +%Y%m%d-%H%M%S)"
            VERSION="${CURRENT_VERSION}"
            NAME="Alterminal ${TAG} (dev)"
            PRERELEASE=true
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version "${{ steps.release_info.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        # Single source of truth for packaging (shared with CI's package job)
        # so the two can never drift: bare vsce package → inject the full prod
        # dependency closure + platform binaries → verify-package gate → repack.
        run: bash scripts/package-vsix.sh alterminal.vsix --all-platforms

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          generate_release_notes: true
          files: alterminal.vsix
