name: Package & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. dev-20260310)"
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install all platform binaries
        run: |
          PKGS=(
            "@lydell/node-pty-darwin-arm64"
            "@lydell/node-pty-darwin-x64"
            "@lydell/node-pty-linux-arm64"
            "@lydell/node-pty-linux-x64"
            "@lydell/node-pty-win32-x64"
          )
          for pkg in "${PKGS[@]}"; do
            if [ ! -d "node_modules/$pkg" ]; then
              tarball=$(npm pack "$pkg" --pack-destination /tmp 2>/dev/null)
              mkdir -p "node_modules/$pkg"
              tar xzf "/tmp/$tarball" -C "node_modules/$pkg" --strip-components=1
              # Remove os/cpu restrictions so npm list accepts them on any platform
              node -e "const p=require('./' + 'node_modules/$pkg/package.json'); delete p.os; delete p.cpu; require('fs').writeFileSync('node_modules/$pkg/package.json', JSON.stringify(p, null, 2))"
            fi
          done

      - name: Determine release info
        id: release_info
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            # Sync package.json version from tag (v0.2.0 -> 0.2.0)
            VERSION="${TAG#v}"
            NAME="Alterminal ${TAG}"
            PRERELEASE=false
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
            VERSION="${CURRENT_VERSION}"
            NAME="Alterminal ${TAG} (dev)"
            PRERELEASE=true
          else
            TAG="dev-$(date +%Y%m%d-%H%M%S)"
            VERSION="${CURRENT_VERSION}"
            NAME="Alterminal ${TAG} (dev)"
            PRERELEASE=true
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version "${{ steps.release_info.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version --skip-license -o alterminal.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          prerelease: ${{ steps.release_info.outputs.prerelease }}
          generate_release_notes: true
          files: alterminal.vsix
