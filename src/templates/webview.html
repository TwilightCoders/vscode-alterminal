<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src vscode-webview: https://*.vscode-cdn.net data:; style-src vscode-webview: https://*.vscode-cdn.net 'unsafe-inline'; script-src vscode-webview: https://*.vscode-cdn.net 'unsafe-inline'; connect-src 'none'; img-src vscode-webview: https://*.vscode-cdn.net data:;">
    <title>Alterminal</title>
    <!-- Timestamp {{timestamp}} to force webview refresh -->
    <link rel="stylesheet" href="{{codiconCssUri}}" />
    <link rel="stylesheet" href="{{xtermCssUri}}" />
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            color: var(--vscode-terminal-foreground, #cccccc);
            font-family: var(--vscode-editor-font-family, 'Courier New', monospace);
        }
        
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--vscode-panel-border, var(--vscode-tab-border, rgba(128, 128, 128, 0.35)));
        }
        
        .container.vertical-tabs {
            flex-direction: row;
        }
        
        .tab-bar {
            border-bottom: 1px solid var(--vscode-tab-border, rgba(128, 128, 128, 0.35));
            flex-shrink: 0;
            min-height: 28px;
            /* Allow height to expand when tabs wrap */
            height: auto;
            overflow: visible;
            position: relative;
            z-index: 10000;
            /* Ensure background covers any wrapped rows so terminal isn't visible between tabs */
            background: var(--vscode-editor-background, #1e1e1e);
        }
        
        .tab-list {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            width: 100%;
            /* Enable wrapping to multiple rows when horizontal */
            flex-wrap: wrap;
            align-content: flex-start;
        }
        
        .container.vertical-tabs .tab-bar {
            border-bottom: none;
            border-right: 1px solid var(--vscode-tab-border, rgba(128, 128, 128, 0.35));
            width: 200px;
            min-width: 190px;
            height: 100vh;
            flex-shrink: 0;
        }
        
        .container.vertical-tabs .tab-list {
            flex-direction: column;
            height: 100%;
        }
        
        .tab {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--vscode-tab-inactiveBackground, rgba(45, 45, 45, 0.5));
            color: var(--vscode-tab-inactiveForeground, #cccccc);
            border: 1px solid rgba(128, 128, 128, 0.2);
            cursor: default;
            padding: 6px 10px;
            margin: 0;
            min-width: 96px;
            max-width: 300px;
            transition: all 0.1s ease;
            position: relative;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: visible;
            font-size: 12px;
        }

        /* When tabs wrap to multiple rows, add subtle separation */
        .tab-bar .tab:nth-child(n+1) { border-top: none; }
        .tab-bar.multi-row { padding-bottom: 2px; }

        /* When wrapping occurs, let tabs flex to share full row width to avoid narrow columns over terminal */
        .tab-bar.multi-row .tab {
            flex: 1 1 0;
            max-width: none;
        }

        /* Prevent extremely wide single tab dominating row after wrap */
        .tab-bar.multi-row .tab { min-width: 110px; }

        /* Detect multi-row via JS (class added) or fallback: if wrapping, last row gets extra bottom padding inherently */
        
        .container.vertical-tabs .tab {
            border-right: none;
            border-bottom: 1px solid var(--vscode-tab-border, rgba(128, 128, 128, 0.35));
            max-width: none;
            width: 100%;
            justify-content: space-between;
            padding: 4px 0px;
            min-height: 28px;
        }
        
        .tab.active {
            background-color: var(--vscode-tab-activeBackground, rgba(60, 60, 60, 0.8));
            color: var(--vscode-tab-activeForeground, #ffffff);
            /* Clean accent line along the bottom of the selected tab, the way
               VS Code styles the active editor tab. Prefer the theme's
               tab.activeBorder; fall back to a subtle light grey so the
               indicator is always present (the bare var defaults to transparent
               on themes that don't set it). */
            border-bottom: 1px solid var(--vscode-tab-activeBorder, rgba(204, 204, 204, 0.4));
        }
        
        .tab:hover {
            background-color: var(--vscode-tab-hoverBackground, rgba(70, 70, 70, 0.7));
        }
        
        .tab:focus {
            outline: none;
            border-color: var(--vscode-focusBorder, #007acc) !important;
            box-shadow: 0 0 0 1px var(--vscode-focusBorder, #007acc) !important;
        }
        
        /* Tab drag and drop styles */
        .tab.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .tab.drag-over-left {
            border-left: 4px solid var(--vscode-focusBorder, #007acc) !important;
            box-shadow: -4px 0 8px rgba(0, 122, 204, 0.5);
        }

        .tab.drag-over-right {
            border-right: 4px solid var(--vscode-focusBorder, #007acc) !important;
            box-shadow: 4px 0 8px rgba(0, 122, 204, 0.5);
        }

        .tab[draggable="true"] {
            cursor: pointer;
        }

        .tab[draggable="true"]:active {
            cursor: grabbing;
        }
        
        .tab-launcher {
            flex: 0 0 36px;
            min-width: 36px;
            max-width: 36px;
            justify-content: center;
            padding: 6px 0;
            cursor: pointer;
            color: var(--vscode-tab-inactiveForeground, #cccccc);
            user-select: none;
            background-color: transparent;
            border-color: transparent;
            opacity: 0.18;
            transition: opacity 0.12s ease, background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }

        .tab-launcher-icon {
            margin: 0;
            width: 16px;
            height: 16px;
            min-width: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .tab-launcher-icon .codicon {
            font-size: 16px;
            line-height: 1;
            transform: translateY(-0.5px);
        }

        .tab-launcher:hover {
            opacity: 1;
            color: var(--vscode-tab-activeForeground, #ffffff);
            background-color: var(--vscode-tab-hoverBackground, rgba(70, 70, 70, 0.7));
            border-color: rgba(128, 128, 128, 0.2);
        }

        .tab-launcher:focus,
        .tab-launcher:focus-visible {
            outline: 2px solid var(--vscode-focusBorder, #007ACC);
            outline-offset: -2px;
            opacity: 1;
            color: var(--vscode-tab-activeForeground, #ffffff);
            background-color: var(--vscode-tab-hoverBackground, rgba(70, 70, 70, 0.7));
            border-color: rgba(128, 128, 128, 0.2);
        }

        .tab-bar.multi-row .tab-launcher {
            flex: 0 0 36px;
            max-width: 36px;
            min-width: 36px;
        }

        .container.vertical-tabs .tab-launcher {
            width: 100%;
            min-width: 0;
            max-width: none;
            flex: 0 0 auto;
        }
        
        .tab-label {
            flex: 1;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            font-size: 13px;
            line-height: 1.2;
        }
        
        .container.vertical-tabs .tab-label {
            flex: 1;
            margin-right: 4px;
            min-width: 0;
            max-width: calc(100% - 40px);
        }
        
        
        /* Codicon font styling for close button */
        .codicon {
            font-family: "codicon";
            font-display: swap;
            font-style: normal;
            font-variant: normal;
            font-weight: normal;
            font-size: inherit;
            line-height: 1;
            text-decoration: none;
            text-rendering: auto;
            text-align: start;
            text-transform: none;
            white-space: nowrap;
            speak: none;
            word-wrap: normal;
            -webkit-font-feature-settings: "liga" off, "calt" off;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .codicon-trash:before {
            content: "\ea81";
        }

        .codicon-terminal:before {
            content: "\ea85";
        }

        .codicon-console:before {
            content: "\ea6d";
        }

        .codicon-robot:before {
            content: "\eaa2";
        }

        .codicon-rocket:before {
            content: "\eb44";
        }

        .codicon-save:before {
            content: "\ea71";
        }

        .codicon-settings-gear:before {
            content: "\eb51";
        }

        .codicon-close:before {
            content: "\ea76";
        }

        .codicon-bell:before {
            content: "\ea85";
        }

        .codicon-bell-dot:before {
            content: "\eb9a";
        }
        
        /* Tab close button accessibility and interaction */
        
        /* Accessibility: Focus indicators */
        .tab:focus,
        .tab:focus-visible {
            outline: 2px solid var(--vscode-focusBorder, #007ACC);
            outline-offset: -2px;
        }
        
        

        .tab-icon {
            margin-right: 6px;
            margin-left: 6px;
            padding: 2px;
            cursor: pointer;
            border-radius: 2px;
            font-size: 14px;
            transition: all 0.2s ease;
            color: var(--vscode-tab-inactiveForeground, #cccccc);
            background-color: transparent;
            border: none;
            line-height: 1;
            width: 16px;
            height: 16px;
            min-width: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .tab.active .tab-icon {
            color: var(--vscode-tab-activeForeground, #ffffff);
        }

        .tab-icon:hover {
            background-color: var(--vscode-toolbar-hoverBackground, rgba(90, 93, 94, 0.31));
            color: var(--vscode-tab-activeForeground, #ffffff);
        }

        .tab-icon:focus,
        .tab-icon:focus-visible {
            outline: 2px solid var(--vscode-focusBorder, #007ACC);
            outline-offset: 1px;
            border-radius: 2px;
        }

        .tab-icon.notification {
            color: #ff8c00;
        }

        .tab.active .tab-icon.notification {
            color: var(--vscode-tab-activeForeground, #ffffff);
        }

        .tab.active .tab-icon.notification .codicon {
            animation: none;
        }

        /* Close button — mirrors VS Code's editor tab close-button pattern.
           Visible on active tab and on tab hover; reserves space always so
           the label width doesn't jump on hover. */
        .tab-close {
            font-size: 14px;
            line-height: 1;
            width: 16px;
            height: 16px;
            min-width: 16px;
            padding: 0;
            margin-left: 6px;
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            visibility: hidden;
            position: relative;
        }

        .tab.active .tab-close,
        .tab:hover .tab-close {
            visibility: visible;
        }

        .tab-close:hover {
            background-color: var(--vscode-toolbar-hoverBackground, rgba(90, 93, 94, 0.31));
            color: var(--vscode-tab-activeForeground, #ffffff);
        }

        /* Background activity: dot rendered in the close-button slot,
           replaces × until the user hovers the tab. Same VS Code "dirty
           file" pattern. */
        .tab.activity .tab-close {
            visibility: visible;
        }

        .tab.activity .tab-close::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .tab.activity:hover .tab-close::before {
            content: "\ea76";
            position: static;
            transform: none;
            width: auto;
            height: auto;
            border-radius: 0;
            background: none;
        }

        /* Bell-swing — animate the bell glyph itself, pivoted from the top.
           Damped: a few decreasing swings, then a quiet pause before the
           next ring, like a clapper that's been struck. */
        .tab-icon.notification .codicon {
            display: inline-block;
            transform-origin: 50% 0%;
            animation: bell-ring 2.4s ease-in-out infinite;
        }

        @keyframes bell-ring {
            0%   { transform: rotate(0); }
            6%   { transform: rotate(-22deg); }
            14%  { transform: rotate(18deg); }
            22%  { transform: rotate(-12deg); }
            30%  { transform: rotate(8deg); }
            38%  { transform: rotate(-4deg); }
            46%, 100% { transform: rotate(0); }
        }

        .tab-dropdown {
            position: absolute;
            background: var(--vscode-dropdown-background, #3c3c3c);
            border: 1px solid var(--vscode-dropdown-border, #454545);
            border-radius: 4px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            min-width: 120px;
            display: none;
            flex-direction: column;
            padding: 4px 0;
            top: 100%;
            left: 0;
        }

        .tab-dropdown.show {
            display: flex;
        }

        .tab-dropdown-item {
            padding: 6px 12px;
            color: var(--vscode-dropdown-foreground, #cccccc);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            background: transparent;
            border: none;
            text-align: left;
            width: 100%;
        }

        .tab-dropdown-item:hover {
            background: var(--vscode-list-hoverBackground, rgba(90, 93, 94, 0.31));
            color: var(--vscode-list-hoverForeground, #ffffff);
        }

        .tab-dropdown-item:focus,
        .tab-dropdown-item:focus-visible {
            outline: none;
            background: var(--vscode-list-focusBackground, #094771);
            color: var(--vscode-list-focusForeground, #ffffff);
        }

        .tab-dropdown-item .codicon {
            margin-right: 8px;
            font-size: 14px;
            width: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-dropdown-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tab-dropdown-item.disabled:hover {
            background: transparent;
            color: var(--vscode-dropdown-foreground, #cccccc);
        }
        
        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .tab {
                border: 1px solid var(--vscode-contrastBorder, transparent);
            }
            
            .tab:focus,
            .tab:focus-visible {
                outline-width: 3px;
            }
            
        }
        
        
        .terminal-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: var(--vscode-terminal-background, var(--vscode-panel-background, #1e1e1e));
        }
        
        .terminal-wrapper {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: var(--vscode-terminal-background, var(--vscode-panel-background, #1e1e1e));
        }
        
        .terminal-wrapper.active {
            display: block;
        }
        
        .terminal-instance {
            position: absolute;
            width: calc(100% - 12px);
            height: calc(100% - 6px);
            top: 6px;
            left: 6px;
            box-sizing: border-box;
        }
        
        .terminal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.08);
            color: var(--vscode-foreground, #ffffff);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            z-index: 5000; /* Above terminal instances but below tab bar (tab bar has 10000) */
            pointer-events: none; /* Do not block drop events on container */
        }
        .terminal-overlay.show { display: flex; opacity: 1; }
        
    /* (show class now defined above for fade-in) */
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 16px;
            color: var(--vscode-foreground, #cccccc);
            font-size: 13px;
        }
        
        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--vscode-foreground, #cccccc);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Tab responsiveness */
        @media (max-width: 800px) {
            .container:not(.vertical-tabs) .tab {
                min-width: 100px;
                max-width: 200px;
            }
            
            .container:not(.vertical-tabs) .tab-label {
                font-size: 12px;
            }
        }
        
        @media (max-width: 600px) {
            .container:not(.vertical-tabs) .tab {
                min-width: 80px;
                max-width: 150px;
                padding: 8px 8px;
            }
        }
        
        /* Drag and drop styling - minimal visual feedback via background color only */
        
        
        /* XTerm.js cursor override for file path links */
        /* Normal mode: file paths get text cursor for selection */
        .xterm-screen.xterm-cursor-pointer {
            cursor: text !important;
        }
        
        /* CMD mode: override with pointer cursor for clicking */
        .cmd-mode .xterm-screen.xterm-cursor-pointer {
            cursor: pointer !important;
        }

        /* Close confirmation dialog */
        .close-confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .close-confirm-dialog {
            background: var(--vscode-editor-background, #1e1e1e);
            border: 1px solid var(--vscode-widget-border, #454545);
            border-radius: 8px;
            padding: 20px 24px;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .close-confirm-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--vscode-foreground);
            margin-bottom: 8px;
        }
        .close-confirm-body {
            font-size: 13px;
            color: var(--vscode-descriptionForeground, #999);
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .close-confirm-body strong {
            color: var(--vscode-foreground);
        }
        .close-confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .close-confirm-actions button {
            padding: 6px 14px;
            border-radius: 4px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }
        .close-confirm-cancel {
            background: transparent;
            color: var(--vscode-foreground);
            border: 1px solid var(--vscode-widget-border, #454545) !important;
        }
        .close-confirm-cancel:hover {
            background: var(--vscode-toolbar-hoverBackground, rgba(255,255,255,0.1));
        }
        .close-confirm-terminate {
            background: var(--vscode-statusBarItem-errorBackground, #c53535);
            color: var(--vscode-statusBarItem-errorForeground, #fff);
        }
        .close-confirm-terminate:hover {
            opacity: 0.9;
        }
        .close-confirm-terminate:focus-visible {
            outline: 2px solid var(--vscode-focusBorder);
            outline-offset: 1px;
        }

        /* Launch menu modal */
        .launch-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 72px 16px 16px;
            z-index: 10002;
        }
        .launch-menu-dialog {
            background: var(--vscode-editor-background, #1e1e1e);
            border: 1px solid var(--vscode-widget-border, #454545);
            border-radius: 8px;
            padding: 16px;
            width: min(760px, 92vw);
            max-height: min(80vh, 680px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .launch-menu-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--vscode-foreground);
            margin-bottom: 10px;
        }
        .launch-menu-search {
            padding: 6px 10px;
            font: inherit;
            font-size: 13px;
            color: var(--vscode-input-foreground);
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-input-border, var(--vscode-widget-border, #454545));
            border-radius: 4px;
            outline: none;
            margin-bottom: 10px;
        }
        .launch-menu-search:focus {
            border-color: var(--vscode-focusBorder);
        }
        .launch-menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            min-height: 0;
            flex: 1 1 auto;
            padding-right: 2px;
        }
        .launch-menu-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .launch-menu-section-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--vscode-descriptionForeground, #999);
            margin: 2px 2px 0;
        }
        .launch-menu-section-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .launch-menu-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            padding: 8px 10px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--vscode-foreground);
            text-align: left;
            cursor: pointer;
            font: inherit;
        }
        .launch-menu-item:hover {
            background: var(--vscode-list-hoverBackground, rgba(255, 255, 255, 0.08));
            border-color: var(--vscode-list-hoverBackground, rgba(255, 255, 255, 0.08));
        }
        .launch-menu-item:focus,
        .launch-menu-item:focus-visible {
            outline: none;
            border-color: var(--vscode-focusBorder);
            box-shadow: 0 0 0 1px var(--vscode-focusBorder);
        }
        .launch-menu-item-static {
            cursor: default;
            opacity: 0.95;
        }
        .launch-menu-item-static:hover {
            background: transparent;
            border-color: transparent;
        }
        .launch-menu-item-icon {
            margin-top: 2px;
            width: 16px;
            min-width: 16px;
            font-size: 16px;
            color: var(--vscode-descriptionForeground, #999);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .launch-menu-item-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .launch-menu-item-label {
            font-size: 13px;
            color: var(--vscode-foreground);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .launch-menu-item-description {
            font-size: 12px;
            color: var(--vscode-descriptionForeground, #999);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .launch-menu-item-detail {
            font-size: 11px;
            color: var(--vscode-descriptionForeground, #999);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .launch-menu-empty {
            padding: 16px 4px;
            text-align: center;
            color: var(--vscode-descriptionForeground, #999);
            font-size: 12px;
        }
        .launch-menu-status {
            margin-top: 8px;
            font-size: 11px;
            color: var(--vscode-descriptionForeground, #999);
            min-height: 1em;
        }

        /* Icon picker modal */
        .icon-picker-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
        }
        .icon-picker-dialog {
            background: var(--vscode-editor-background, #1e1e1e);
            border: 1px solid var(--vscode-widget-border, #454545);
            border-radius: 8px;
            padding: 16px;
            width: min(560px, 90vw);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .icon-picker-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--vscode-foreground);
            margin-bottom: 10px;
        }
        .icon-picker-search {
            padding: 6px 10px;
            font: inherit;
            font-size: 13px;
            color: var(--vscode-input-foreground);
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-input-border, var(--vscode-widget-border, #454545));
            border-radius: 4px;
            outline: none;
            margin-bottom: 10px;
        }
        .icon-picker-search:focus {
            border-color: var(--vscode-focusBorder);
        }
        .icon-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
            gap: 2px;
            overflow-y: auto;
            padding: 4px;
            background: var(--vscode-editorWidget-background, rgba(0,0,0,0.15));
            border-radius: 4px;
            flex: 1 1 auto;
            min-height: 0;
        }
        .icon-picker-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 3px;
            color: var(--vscode-foreground);
            cursor: pointer;
            padding: 0;
            font: inherit;
        }
        .icon-picker-cell:hover {
            background: var(--vscode-list-hoverBackground, rgba(255,255,255,0.08));
        }
        .icon-picker-cell:focus-visible,
        .icon-picker-cell:focus {
            outline: none;
            border-color: var(--vscode-focusBorder, #007fd4);
        }
        .icon-picker-cell .codicon {
            font-size: 18px;
        }
        .icon-picker-empty {
            padding: 24px 12px;
            text-align: center;
            color: var(--vscode-descriptionForeground, #999);
            font-size: 12px;
        }
        .icon-picker-status {
            margin-top: 8px;
            font-size: 11px;
            color: var(--vscode-descriptionForeground, #999);
        }

        /* Floating search bar — matches VS Code's find widget styling */
        .search-bar {
            position: absolute;
            top: 6px;
            right: 14px;
            /* Above terminal instances (z 10) and the drop overlay (z 5000),
               within the terminal area. It sits below the tab bar by virtue
               of being inside .terminal-container, so it doesn't need to beat
               the tab bar's z-index. */
            z-index: 6000;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: var(--vscode-editorWidget-background, #252526);
            border: 1px solid var(--vscode-editorWidget-border, #454545);
            border-top: none;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.36);
            color: var(--vscode-editorWidget-foreground, #cccccc);
            font-size: 12px;
        }
        .search-bar[hidden] { display: none; }
        .search-input {
            background: var(--vscode-input-background, #3c3c3c);
            color: var(--vscode-input-foreground, #cccccc);
            border: 1px solid var(--vscode-input-border, transparent);
            border-radius: 2px;
            padding: 2px 6px;
            font: inherit;
            outline: none;
            min-width: 200px;
        }
        .search-input:focus {
            border-color: var(--vscode-focusBorder, #007fd4);
        }
        .search-count {
            font-size: 11px;
            color: var(--vscode-descriptionForeground, #999);
            min-width: 56px;
            text-align: right;
        }
        .search-btn {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            border-radius: 3px;
            padding: 2px 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover {
            background: var(--vscode-toolbar-hoverBackground, rgba(90, 93, 94, 0.31));
        }
        .search-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading-screen">
        <div class="loading-spinner"></div>
        <span>Loading terminal...</span>
    </div>
    
    <div id="container" class="container" style="display: none;">
        <nav id="tab-bar" class="tab-bar">
            <ul class="tab-list" role="tablist">
                <!-- Terminal tabs will be dynamically created here -->
            </ul>
        </nav>
        <main class="terminal-container">
            <!-- Terminal instances will be dynamically created here -->
            <!-- Version is shown in the view header (WebviewView.description), not overlaid here -->
            <!-- Floating search bar — anchored to the terminal area so it
                 sits below the tab bar; bound to the active terminal's SearchAddon -->
            <div id="search-bar" class="search-bar" hidden>
                <input type="text" id="search-input" class="search-input" placeholder="Find" aria-label="Find in terminal" />
                <span id="search-count" class="search-count"></span>
                <button type="button" class="search-btn" id="search-prev" title="Previous match (Shift+Enter)" aria-label="Previous match">
                    <span class="codicon codicon-arrow-up"></span>
                </button>
                <button type="button" class="search-btn" id="search-next" title="Next match (Enter)" aria-label="Next match">
                    <span class="codicon codicon-arrow-down"></span>
                </button>
                <button type="button" class="search-btn" id="search-close" title="Close (Esc)" aria-label="Close search">
                    <span class="codicon codicon-close"></span>
                </button>
            </div>
        </main>
    </div>
    <!-- Global file drop overlay -->
    <div class="terminal-overlay" id="file-drop-overlay">
    </div>

    <!-- Load xterm.js and addons -->
    <script src="{{xtermUri}}"></script>
    <script src="{{fitAddonUri}}"></script>
    <script src="{{webglAddonUri}}"></script>
    <script src="{{webLinksAddonUri}}"></script>
    <script src="{{serializeAddonUri}}"></script>
    <script src="{{unicodeAddonUri}}"></script>
    <script src="{{searchAddonUri}}"></script>
    <script src="{{webgpuAddonUri}}"></script>
    <script type="module">
        // Import and make LinkProvider globally available for other modules
        import { LinkProvider } from '{{linkProviderUri}}';
        window.LinkProvider = LinkProvider;
    </script>
    <script>
        // Acquire VS Code API and make it global for ES6 modules
        window.vscode = acquireVsCodeApi();

        // Renderer selection (alterminal.renderer): "webgl" (default, GPU) or
        // "dom" (xterm built-in, no glyph atlas). Read by terminal.ts at create.
        window.__alterminalRenderer = "{{rendererMode}}";

        {{combinedScript}}
    </script>
    
    <!-- Import map for ES6 module resolution -->
    <script type="importmap">
    {
        "imports": {
            "../constants.js": "{{constantsUri}}",
            "./inputHandler.js": "{{inputHandlerUri}}",
            "./tabTitleManager.js": "{{tabTitleManagerUri}}",
            "./terminal.js": "{{terminalUri}}",
            "./messageHandler.js": "{{messageHandlerUri}}",
            "./keyboardManager.js": "{{keyboardManagerUri}}",
            "./tabUIManager.js": "{{tabUIManagerUri}}",
            "./layoutManager.js": "{{layoutManagerUri}}",
            "./launchMenuModal.js": "{{launchMenuModalUri}}",
            "./tabManager.js": "{{tabManagerUri}}",
            "./dragDropHandler.js": "{{dragDropHandlerUri}}",
            "./init.js": "{{initUri}}"
        }
    }
    </script>
    
    <!-- Load webview ES6 modules in dependency order -->
    <script type="module" src="{{inputHandlerUri}}"></script>
    <script type="module" src="{{tabTitleManagerUri}}"></script>
    <script type="module" src="{{terminalUri}}"></script>
    <script type="module" src="{{messageHandlerUri}}"></script>
    <script type="module" src="{{keyboardManagerUri}}"></script>
    <script type="module" src="{{tabUIManagerUri}}"></script>
    <script type="module" src="{{layoutManagerUri}}"></script>
    <script type="module" src="{{launchMenuModalUri}}"></script>
    <script type="module" src="{{tabManagerUri}}"></script>
    <script type="module" src="{{dragDropHandlerUri}}"></script>
    <script type="module" src="{{initUri}}"></script>
</body>
</html>
